      if (typeof globalThis.ComlinkWorker === 'undefined') {
        globalThis.ComlinkWorker = function ComlinkWorker(url) {
          const modulePromise = import(url.href);
          return new Proxy(
            {},
            {
              get: function (_target, prop) {
                if (prop === 'then') return undefined;
                return async function () {
                  const mod = await modulePromise;
                  const value = mod[prop];

                  }
                  return value;
                };
              },
            }
          );
        };
      }
